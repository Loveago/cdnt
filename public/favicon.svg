<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="favSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="38" fill="#047857" opacity="0.25" filter="url(#softGlow)" />

  <!-- Outer Orbital Network Arc -->
  <path
    d="M 94 36 A 44 44 0 1 0 96 90"
    fill="none"
    stroke="url(#favEmerald)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-dasharray="92 8"
  />

  <!-- Inner High-Speed Data Flow Arc -->
  <path
    d="M 80 48 A 26 26 0 1 0 84 80"
    fill="none"
    stroke="url(#pulseGlow)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- The Cedi Currency Bar (₵ slash) through the center -->
  <path
    d="M 44 26 L 84 102"
    stroke="url(#favEmerald)"
    stroke-width="7.5"
    stroke-linecap="round"
  />

  <!-- Pulse Network Connectivity Nodes -->
  <circle cx="94" cy="36" r="5.5" fill="url(#favSphere)" />
  <circle cx="96" cy="90" r="5" fill="url(#favSphere)" />
  <circle cx="64" cy="64" r="4.5" fill="#FFFFFF" />
  <circle cx="84" cy="102" r="5.5" fill="url(#favSphere)" />
  <circle cx="44" cy="26" r="4" fill="#67E8F9" />
</svg>