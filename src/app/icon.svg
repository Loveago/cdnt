<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="favSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />

  <!-- Inner subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5" />

  <!-- Cedi Arc + Network Node Mark -->
  <g transform="translate(0, 0)">
    <!-- Ambient glow circle -->
    <circle cx="64" cy="64" r="34" fill="#059669" opacity="0.3" filter="url(#glow)" />

    <!-- Outer orbital Cedi arc -->
    <path
      d="M 94 36 A 44 44 0 1 0 96 90"
      fill="none"
      stroke="url(#favEmerald)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-dasharray="92 8"
    />

    <!-- Inner pulse arc -->
    <path
      d="M 82 48 A 26 26 0 1 0 84 80"
      fill="none"
      stroke="#38BDF8"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Diagonal Cedi Slash (₵) -->
    <path
      d="M 46 26 L 82 102"
      stroke="url(#favEmerald)"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- Glowing Network Nodes -->
    <circle cx="94" cy="36" r="6" fill="url(#favSphere)" />
    <circle cx="96" cy="90" r="5" fill="url(#favSphere)" />
    <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
    <circle cx="82" cy="102" r="6" fill="url(#favSphere)" />
    <circle cx="46" cy="26" r="4.5" fill="#67E8F9" />
  </g>
</svg>